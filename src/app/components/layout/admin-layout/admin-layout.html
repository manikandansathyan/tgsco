
<div class="admin-shell">
  @if (isSidebarOpen) {
    <button
      class="sidebar-overlay"
      type="button"
      aria-label="Close navigation"
      (click)="closeSidebar()"
    ></button>
  }

  <aside class="sidebar-container" [class.sidebar-open]="isSidebarOpen">
    <app-sidebar (closeMenu)="closeSidebar()" />
  </aside>

  <div class="main-column">
    <app-topbar (menuClick)="openSidebar()" />

    <main class="page-content">
      <router-outlet />
    </main>
  </div>
</div>
