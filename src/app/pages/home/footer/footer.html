<div class="development-page">
  <div class="development-card">
    <div class="icon-wrapper">
      <span class="construction-icon">🚧</span>
    </div>

    <span class="status-label">UNDER DEVELOPMENT</span>

    <h1>
      Something <span>awesome</span> is brewing!
    </h1>

    <p class="description">
      Our admin team is busy building this page.
      We're adding the finishing touches to make your experience
      even better. Stay tuned!
    </p>

    <div class="progress-info">
      <span class="progress-dot"></span>
      <span>Our developers are on it!</span>
    </div>

    <button class="dashboard-button" (click)="goToDashboard()">
      <span>←</span>
      Back to Dashboard
    </button>

    <p class="footer-note">
      Thanks for your patience. Great things take time!
    </p>
  </div>
</div>
