<div class="development-page">
  <span class="orb orb-one"></span>
  <span class="orb orb-two"></span>

  <div class="development-card">
    <span class="card-accent"></span>
    <span class="watermark" aria-hidden="true">404</span>

    <div class="icon-wrapper">
  <span class="ring ring-outer"></span>
  <span class="ring ring-inner"></span>
  <span class="orbit"><i></i></span>
  <span class="error-code"><b>4</b><b>0</b><b>4</b></span>
</div>

    <span class="status-label">
      <i class="status-dot"></i>
      PAGE NOT FOUND
    </span>

    <h1>
      Oops! This page <span>doesn't exist.</span>
    </h1>

    <p class="description">
      The page you're looking for may have been removed,
      renamed, or is currently unavailable.
    </p>

    <div class="progress-info">
      <span class="progress-dot"></span>
      <span>Let's get you back on track.</span>
    </div>

    <button class="dashboard-button" (click)="goToDashboard()">
      <span class="arrow">←</span>
      Back to Dashboard
    </button>

    <div class="footer-divider"></div>
    <p class="footer-note">
      Error Code: 404 | Page Not Found
    </p>
  </div>
</div>
